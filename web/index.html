<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Darts S.A.M">
<meta name="theme-color" content="#2b1b11">
<meta name="description" content="Darts S.A.M: a darts scoreboard that scores by itself, with cameras or by tapping the board. Free, with no adverts.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="themes.css">
<script>
// Apply the saved theme before the first paint (app.js keeps it up to date).
try { document.documentElement.className = 't-' + (JSON.parse(localStorage.getItem('settings')).theme || 'chalk'); }
catch (e) { document.documentElement.className = 't-chalk'; }
</script>
<title>Darts S.A.M</title>
</head>
<body>
<div id="app"></div>
<script type="module" src="app.js"></script>
<script type="module" src="install.js"></script>
</body>
</html>
