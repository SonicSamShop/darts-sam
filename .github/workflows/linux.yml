# Linux: builds DartsSAM (one program, no Python needed), checks that it
# starts, and packs it with install.sh into DartsSAM-linux-x86_64.tar.gz.
# It is kept with the run: Actions → the run → Artifacts → DartsSAM-linux-<version>
# (release.json's version).
#
# Built on the oldest Ubuntu GitHub offers, because the program runs on Linux
# systems at least as new as the one it was built on.
# No cameras are plugged into GitHub's machines, so the program is started with
# --no-cameras: this cannot say whether real cameras work.
name: Linux

# Builds cost GitHub Actions minutes (Mac ones most), so they run only for a
# release: when a push raises "version" in release.json (docs/releasing.md),
# or when started by hand (Actions → this workflow → Run workflow) to check
# that the apps still build. (The tests run on every push: tests.yml.) The server only gives out a
# build whose version is new, so a test build never reaches anyone.
on:
  push:
    branches: [main]
    paths: [release.json]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    # Did this push raise the version? Adding lines to "unreleased" doesn't.
    runs-on: ubuntu-latest
    outputs:
      new: ${{ steps.compare.outputs.new }}
    steps:
      - uses: actions/checkout@v4
      - id: compare
        run: |
          version() { python3 -c "import json, sys; print(json.load(sys.stdin)['version'])"; }
          now=$(version < release.json)
          before=none
          if [ "${{ github.event_name }}" = push ] && git fetch --quiet --depth=1 origin "${{ github.event.before }}" 2>/dev/null; then
            before=$(git show FETCH_HEAD:release.json 2>/dev/null | version 2>/dev/null || echo none)
          fi
          echo "version before: $before, now: $now (${{ github.event_name }})"
          if [ "${{ github.event_name }}" != push ] || [ "$before" != "$now" ]; then echo "new=true" >> "$GITHUB_OUTPUT"; fi

  build:
    needs: release
    if: needs.release.outputs.new == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # all of history: the build number counts commits (server/build.py)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt pyinstaller
      - run: python tools/build_exe.py
      - name: The program starts, serves the page and keeps its data in the user's folder
        run: |
          dist/DartsSAM --no-browser --no-cameras --port 8123 > out.log 2>&1 &
          up=""
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:8123/version.json; then up=1; break; fi
            sleep 1
          done
          if [ -n "$up" ]; then
            curl -sf -o /dev/null -w "\npage %{http_code}\n" http://127.0.0.1:8123/
            curl -sf http://127.0.0.1:8123/api/status
            # it knows its version: release.json was built in
            curl -sf http://127.0.0.1:8123/api/update | grep -F "\"version\":\"$(python -c "import json; print(json.load(open('release.json'))['version'])")\"" || { echo "it does not know its version: release.json was not built in"; up=""; }
          fi
          kill %1 || true
          cat out.log
          [ -n "$up" ] || { echo "DartsSAM did not answer within 90 seconds"; exit 1; }
          [ -f "$HOME/.local/share/dartssam/data/dartssam.db" ] || { echo "no database in ~/.local/share/dartssam"; exit 1; }
      - name: install.sh puts it in the app menu, and --uninstall takes it out
        run: |
          mkdir try && tar -xzf dist/DartsSAM-linux-x86_64.tar.gz -C try
          try/DartsSAM/install.sh
          test -x ~/.local/bin/DartsSAM
          cat ~/.local/share/applications/dartssam.desktop
          test -f ~/.local/share/icons/hicolor/512x512/apps/dartssam.png
          try/DartsSAM/install.sh --uninstall
          test ! -e ~/.local/bin/DartsSAM
      - id: release
        shell: bash
        run: echo "version=$(python -c "import json; print(json.load(open('release.json'))['version'])")" >> "$GITHUB_OUTPUT"
      # Signed with the key only GitHub holds, so the apps' Update can tell the
      # build is genuine (tools/sign_release.py, server/release.py).
      - name: Sign the build
        shell: bash
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: python tools/sign_release.py sign linux dist/DartsSAM-linux-*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: DartsSAM-linux-${{ steps.release.outputs.version }}
          path: |
            dist/DartsSAM-linux-*.tar.gz
            dist/DartsSAM-linux-*.tar.gz.sig
            dist/release.json
          if-no-files-found: error
          retention-days: 14  # the server fetches a release within minutes, and keeps it
